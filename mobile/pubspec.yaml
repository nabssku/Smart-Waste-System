name: smart_waste_mobile
description: Smart Waste Management System — Municipal Field Reporting Mobile Application (Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State Management
  provider: ^6.1.2
  # HTTP Client & Multipart Upload
  dio: ^5.4.3+1
  http_parser: ^4.0.2
  # Local Session Persistence
  shared_preferences: ^2.2.3
  # Camera & Gallery Image Capture
  image_picker: ^1.1.2
  # GPS Coordinates & Location Permissions
  geolocator: ^12.0.0
  # Interactive Map & Open in Google Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  # Date & Number Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
